<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      background: #020617;
      color: #f9fafb;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <h1 id="msg">Redirecting…</h1>

  <script>
    // ⭐ PASTE YOUR KEYS HERE ⭐
    const SUPABASE_URL = "https://rcimfwrxcnnwgwqbywdm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aP-5Jjna5uNqjTJyuWNssw_zxG3pXRZ";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function go() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const msg = document.getElementById("msg");

      if (!id) {
        msg.textContent = "Missing QR ID.";
        return;
      }

      const { data } = await supabase
        .from("qrcodes")
        .select("url")
        .eq("id", id)
        .maybeSingle();

      if (!data || !data.url) {
        msg.textContent = "QR code not found.";
        return;
      }

      msg.textContent = "Sending you…";
      location.href = data.url;
    }

    go();
  </script>
</body>
</html>
