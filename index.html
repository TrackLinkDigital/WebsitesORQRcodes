<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Code Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050505;
      --card: #111111;
      --accent: #ffffff;
      --muted: #888888;
      --border: #222222;
      --danger: #ff4b4b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body {
      background: radial-gradient(circle at top, #1b1b1b 0, #050505 45%, #000 100%);
      color: #f5f5f5;
      min-height: 100vh;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 960px;
    }
    .header {
      margin-bottom: 24px;
    }
    .title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .create-card {
      background: rgba(10,10,10,0.95);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
    }
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .field-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .field {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
    }
    input {
      background: #050505;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      color: #f5f5f5;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: #ffffff;
    }
    .btn-primary {
      margin-top: 4px;
      border-radius: 999px;
      border: none;
      background: #ffffff;
      color: #000;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary span {
      font-size: 16px;
      line-height: 0;
    }
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .count {
      font-size: 12px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: rgba(10,10,10,0.95);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-top {
      display: flex;
      gap: 10px;
    }
    .qr-box {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .card-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-actions {
      display: flex;
      gap: 4px;
    }
    .icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn.danger {
      border-color: rgba(255,75,75,0.4);
      color: var(--danger);
    }
    .url {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .pill {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 3px 8px;
      font-size: 11px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill strong {
      color: #f5f5f5;
      font-weight: 500;
    }
    .analytics {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #222;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .analytics-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 4px;
    }
    .analytics-item {
      font-size: 11px;
      color: var(--muted);
    }
    .analytics-item strong {
      display: block;
      color: #f5f5f5;
      font-weight: 500;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-secondary {
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #050505;
      color: #f5f5f5;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary span {
      font-size: 13px;
    }
    @media (max-width: 600px) {
      .card-top { flex-direction: column; }
      .qr-box { width: 100%; height: 140px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title">QR Code Manager</div>
      <div class="subtitle">Create and track dynamic QR codes with per‑code analytics.</div>
    </header>

    <section class="create-card">
      <div class="section-title">Create New QR Code</div>
      <div class="field-row">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" placeholder="e.g. YouTube Link" />
        </div>
        <div class="field">
          <label for="url">Destination URL</label>
          <input id="url" placeholder="https://example.com" />
        </div>
      </div>
      <button class="btn-primary" id="createBtn">
        <span>＋</span>
        Create QR Code
      </button>
    </section>

    <section>
      <div class="list-header">
        <div class="section-title">Your QR Codes</div>
        <div class="count"><span id="count">0</span> codes</div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <script>
    // Simple in-memory store (replace with localStorage or backend if you want persistence)
    const codes = [
      {
        id: crypto.randomUUID(),
        name: "test",
        url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        scans: 3,
        uniqueVisitors: 2,
        lastScan: "2026-05-26 19:32",
        todayScans: 1,
        deviceBreakdown: { mobile: 70, desktop: 30 },
        locationTop: "US, UK",
      },
      {
        id: crypto.randomUUID(),
        name: "My Website",
        url: "https://google.com",
        scans: 0,
        uniqueVisitors: 0,
        lastScan: "—",
        todayScans: 0,
        deviceBreakdown: { mobile: 0, desktop: 0 },
        locationTop: "—",
      }
    ];

    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const createBtn = document.getElementById("createBtn");
    const nameInput = document.getElementById("name");
    const urlInput = document.getElementById("url");

    function render() {
      countEl.textContent = codes.length;
      grid.innerHTML = "";
      codes.forEach(code => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div class="card-top">
            <div class="qr-box">
              <!-- Replace with real QR image if you have one -->
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(code.id)}" alt="QR" />
            </div>
            <div class="card-main">
              <div class="card-title-row">
                <div class="card-title" title="${code.name}">${code.name}</div>
                <div class="card-actions">
                  <button class="icon-btn" data-action="edit" data-id="${code.id}">✎</button>
                  <button class="icon-btn danger" data-action="delete" data-id="${code.id}">✕</button>
                </div>
              </div>
              <div class="url">${code.url}</div>
              <div class="stats-row">
                <div class="pill"><strong>${code.scans}</strong> scans</div>
                <div class="pill"><strong>${code.uniqueVisitors}</strong> unique</div>
                <div class="pill"><strong>${code.todayScans}</strong> today</div>
              </div>
              <div class="analytics">
                <div class="analytics-title">Analytics</div>
                <div class="analytics-grid">
                  <div class="analytics-item">
                    <strong>${code.lastScan}</strong>
                    Last scan
                  </div>
                  <div class="analytics-item">
                    <strong>${code.deviceBreakdown.mobile}% / ${code.deviceBreakdown.desktop}%</strong>
                    Mobile / Desktop
                  </div>
                  <div class="analytics-item">
                    <strong>${code.locationTop}</strong>
                    Top locations
                  </div>
                  <div class="analytics-item">
                    <strong>${code.scans === 0 ? "—" : (code.scans / Math.max(1, code.uniqueVisitors)).toFixed(1)}</strong>
                    Avg scans / user
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-secondary" data-action="copy" data-id="${code.id}">
              <span>⧉</span> Copy URL
            </button>
            <button class="btn-secondary" data-action="download" data-id="${code.id}">
              <span>⬇</span> Download
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    createBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      const url = urlInput.value.trim();
      if (!name || !url) return;

      codes.push({
        id: crypto.randomUUID(),
        name,
        url,
        scans: 0,
        uniqueVisitors: 0,
        lastScan: "—",
        todayScans: 0,
        deviceBreakdown: { mobile: 0, desktop: 0 },
        locationTop: "—",
      });

      nameInput.value = "";
      urlInput.value = "";
      render();
    });

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const code = codes.find(c => c.id === id);
      if (!code) return;

      if (action === "delete") {
        const idx = codes.findIndex(c => c.id === id);
        if (idx !== -1) codes.splice(idx, 1);
        render();
      }

      if (action === "edit") {
        const newName = prompt("Rename QR code:", code.name);
        if (newName) code.name = newName.trim();
        render();
      }

      if (action === "copy") {
        navigator.clipboard.writeText(code.url).catch(() => {});
      }

      if (action === "download") {
        // Simple download of the QR image URL
        const a = document.createElement("a");
        a.href = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(code.id)}`;
        a.download = `${code.name || "qr-code"}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    });

    render();
  </script>
</body>
