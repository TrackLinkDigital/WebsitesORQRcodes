<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Dynamic QR Codes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #05060a;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #111827;
      background: #020617;
      position: sticky;
      top: 0;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
    }
    header span {
      font-size: 12px;
      color: #9ca3af;
    }
    main {
      padding: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #111827;
      padding: 14px 16px;
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 10px;
    }
    .qr-box img {
      width: 96px;
      height: 96px;
      border-radius: 8px;
    }
    .card-main {
      flex: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .card-title span.folder {
      font-size: 11px;
      color: #9ca3af;
      background: #020617;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid #111827;
    }
    .card-url {
      font-size: 12px;
      color: #9ca3af;
      word-break: break-all;
      margin-bottom: 6px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #f9fafb;
    }
    button.danger {
      border-color: #b91c1c;
      color: #fecaca;
    }
    .new-form {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #111827;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .new-form h2 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .field label {
      font-size: 11px;
      color: #9ca3af;
    }
    .field input {
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 12px;
      padding: 6px 8px;
    }
    .empty {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-top: 20px;
    }
  </style>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>My Dynamic QR Codes</h1>
    <span>Private dashboard • Editable QR links • Works on any device</span>
  </header>

  <main>
    <section class="new-form">
      <h2>Create new QR code</h2>
      <div class="field">
        <label>Name</label>
        <input id="name" placeholder="e.g. Instagram" />
      </div>
      <div class="field">
        <label>Destination URL</label>
        <input id="url" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Folder (optional)</label>
        <input id="folder" placeholder="e.g. Personal" />
      </div>
      <button id="createBtn" class="primary">Create QR</button>
    </section>

    <section id="list"></section>
    <div id="emptyState" class="empty" style="display:none;">No QR codes yet.</div>
  </main>

  <script>
    // ⭐ PASTE YOUR KEYS HERE ⭐
    const SUPABASE_URL = "YOUR_URL_HERE";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let codes = [];

    async function loadCodes() {
      const { data } = await supabase
        .from("qrcodes")
        .select("*")
        .order("created_at", { ascending: false });

      codes = data || [];
      render();
    }

    function render() {
      const list = document.getElementById("list");
      const emptyState = document.getElementById("emptyState");
      list.innerHTML = "";

      if (!codes.length) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      codes.forEach(code => {
        const redirectUrl = location.origin + "/r.html?id=" + code.id;
        const qrSrc =
          "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
          encodeURIComponent(redirectUrl);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="qr-box">
            <img src="${qrSrc}" />
          </div>
          <div class="card-main">
            <div class="card-title">
              <span>${code.name || "Untitled"}</span>
              <span class="folder">${code.folder || "No folder"}</span>
            </div>
            <div class="card-url">${code.url}</div>
            <div class="card-actions">
              <button onclick="window.open('${code.url}', '_blank')">Open</button>
              <button onclick="copyLink('${redirectUrl}', this)">Copy link</button>
              <button onclick="downloadQR('${redirectUrl}', '${code.name}')">Download</button>
              <button onclick="editCode('${code.id}')">Edit</button>
              <button class="danger" onclick="deleteCode('${code.id}')">Delete</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function createCode() {
      const name = document.getElementById("name").value.trim();
      const url = document.getElementById("url").value.trim();
      const folder = document.getElementById("folder").value.trim();

      if (!url) return alert("URL required");

      await supabase.from("qrcodes").insert({ name, url, folder });

      document.getElementById("name").value = "";
      document.getElementById("url").value = "";
      document.getElementById("folder").value = "";

      loadCodes();
    }

    async function editCode(id) {
      const code = codes.find(c => c.id === id);
      if (!code) return;

      const newName = prompt("New name:", code.name);
      if (newName === null) return;

      const newFolder = prompt("New folder:", code.folder);
      if (newFolder === null) return;

      const newUrl = prompt("New URL:", code.url);
      if (!newUrl) return;

      await supabase
        .from("qrcodes")
        .update({ name: newName, folder: newFolder, url: newUrl })
        .eq("id", id);

      loadCodes();
    }

    async function deleteCode(id) {
      if (!confirm("Delete this QR code?")) return;

      await supabase.from("qrcodes").delete().eq("id", id);
      loadCodes();
    }

    function copyLink(link, btn) {
      navigator.clipboard.writeText(link);
      btn.textContent = "Copied!";
      setTimeout(() => (btn.textContent = "Copy link"), 1000);
    }

    function downloadQR(link, name) {
      const a = document.createElement("a");
      a.href =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
        encodeURIComponent(link);
      a.download = (name || "qr") + ".png";
      a.click();
    }

    document.getElementById("createBtn").addEventListener("click", createCode);

    loadCodes();
  </script>
</body>
</html>
